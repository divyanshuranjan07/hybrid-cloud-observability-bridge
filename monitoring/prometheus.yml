global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'local-node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cloud-node'
    static_configs:
      - targets: ['<AWS_EC2_PUBLIC_IP>:9100']
